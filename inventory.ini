[app]
app01 ansible_connection=local private_ip=10.0.1.10

[database]
db01 ansible_host=10.0.2.40 private_ip=10.0.2.40

[cache]
mc01 ansible_host=10.0.2.20 private_ip=10.0.2.20

[queue]
rmq01 ansible_host=10.0.2.30 private_ip=10.0.2.30

[all:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=/home/ubuntu/.ssh/vprofile-managed
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
